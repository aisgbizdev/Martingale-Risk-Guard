format: replit.sdm
version: 1
size: {width: 1920, height: 1080}
background: {kind: solid, color: {kind: token, token: background}}
theme:
  colors: {background: "#f7f8fb", foreground: "#17345a", accent: "#1061b3", navy: "#083d79", surface: "#eaf2fb", white: "#ffffff"}
  fonts: {display: Newsreader, body: DM Sans}
elements:
  - id: sectionLabel
    type: text
    frame: {x: 120, y: 88, width: 1500, height: 50}
    body:
      paragraphs:
        - {runs: [{text: "04  /  PERAN SUMBER DATA"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 16, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 0}
  - id: title
    type: text
    frame: {x: 120, y: 160, width: 1680, height: 190}
    body:
      paragraphs:
        - {runs: [{text: "Chart, harga, dan berita memiliki peran berbeda."}], defaultRunStyle: {font: {kind: token, token: display}, sizePt: 40, weight: 600, color: {kind: token, token: foreground}}, lineHeight: 1.05, spaceAfterPt: 0}
  - id: chartRole
    type: shape
    frame: {x: 120, y: 410, width: 520, height: 420}
    geometry: {kind: preset, preset: roundRect, cornerRadius: 20}
    fill: {kind: solid, color: {kind: token, token: surface}}
    body:
      insetsPt: {top: 22, right: 20, bottom: 22, left: 20}
      paragraphs:
        - {runs: [{text: "TradingView"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 24, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 20}
        - {runs: [{text: "Visual chart.\nBukan API harga yang dibaca dari widget."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: foreground}}, lineHeight: 1.3, spaceAfterPt: 0}
  - id: priceRole
    type: shape
    frame: {x: 700, y: 410, width: 520, height: 420}
    geometry: {kind: preset, preset: roundRect, cornerRadius: 20}
    fill: {kind: solid, color: {kind: token, token: navy}}
    body:
      insetsPt: {top: 22, right: 20, bottom: 22, left: 20}
      paragraphs:
        - {runs: [{text: "Feed terpisah"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 24, weight: 700, color: {kind: token, token: white}}, lineHeight: 1.2, spaceAfterPt: 20}
        - {runs: [{text: "Harga XUL10 untuk konteks dan indeks.\nTerpisah dari chart."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: white}}, lineHeight: 1.3, spaceAfterPt: 0}
  - id: fundamentalRole
    type: shape
    frame: {x: 1280, y: 410, width: 520, height: 420}
    geometry: {kind: preset, preset: roundRect, cornerRadius: 20}
    fill: {kind: solid, color: {kind: token, token: surface}}
    body:
      insetsPt: {top: 22, right: 20, bottom: 22, left: 20}
      paragraphs:
        - {runs: [{text: "Newsmaker"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 24, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 20}
        - {runs: [{text: "Berita dan kalender ekonomi.\nKonteks fundamental."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: foreground}}, lineHeight: 1.3, spaceAfterPt: 0}
  - id: dailyReference
    type: text
    frame: {x: 120, y: 870, width: 1680, height: 130}
    body:
      paragraphs:
        - {runs: [{text: "LGD Daily D1 adalah referensi emas,\nbukan harga XUL10 yang identik."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 22, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: footer
    type: text
    frame: {x: 120, y: 1030, width: 1500, height: 40}
    body:
      paragraphs:
        - {runs: [{text: "MRG · NEWSMAKER  /  04 — 08"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 14.4, color: {kind: token, token: foreground}}, lineHeight: 1.2, spaceAfterPt: 0}
