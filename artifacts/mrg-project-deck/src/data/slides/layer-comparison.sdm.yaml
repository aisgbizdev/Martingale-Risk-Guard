format: replit.sdm
version: 1
size: {width: 1920, height: 1080}
background: {kind: solid, color: {kind: token, token: background}}
theme:
  colors: {background: "#f7f8fb", foreground: "#17345a", accent: "#1061b3", navy: "#083d79", surface: "#eaf2fb", white: "#ffffff"}
  fonts: {display: Newsreader, body: DM Sans}
elements:
  - id: sectionLabel
    type: text
    frame: {x: 120, y: 88, width: 1500, height: 50}
    body:
      paragraphs:
        - {runs: [{text: "05  /  SIMULATOR AVERAGING & MARTINGALE"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 16, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 0}
  - id: title
    type: text
    frame: {x: 120, y: 160, width: 1680, height: 190}
    body:
      paragraphs:
        - {runs: [{text: "Tambahan layer dapat dibandingkan sebelum dicatat."}], defaultRunStyle: {font: {kind: token, token: display}, sizePt: 40, weight: 600, color: {kind: token, token: foreground}}, lineHeight: 1.05, spaceAfterPt: 0}
  - id: currentStage
    type: shape
    frame: {x: 120, y: 405, width: 520, height: 370}
    geometry: {kind: preset, preset: roundRect, cornerRadius: 20}
    fill: {kind: solid, color: {kind: token, token: surface}}
    body:
      insetsPt: {top: 22, right: 20, bottom: 22, left: 20}
      paragraphs:
        - {runs: [{text: "1. Posisi awal"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 24, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 18}
        - {runs: [{text: "Baca catatan dan batas pribadi."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: foreground}}, lineHeight: 1.3, spaceAfterPt: 0}
  - id: hypotheticalStage
    type: shape
    frame: {x: 700, y: 405, width: 520, height: 370}
    geometry: {kind: preset, preset: roundRect, cornerRadius: 20}
    fill: {kind: solid, color: {kind: token, token: surface}}
    body:
      insetsPt: {top: 22, right: 20, bottom: 22, left: 20}
      paragraphs:
        - {runs: [{text: "2. Layer hipotetis"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 24, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 18}
        - {runs: [{text: "Ubah harga dan lot pada simulasi."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: foreground}}, lineHeight: 1.3, spaceAfterPt: 0}
  - id: comparisonStage
    type: shape
    frame: {x: 1280, y: 405, width: 520, height: 370}
    geometry: {kind: preset, preset: roundRect, cornerRadius: 20}
    fill: {kind: solid, color: {kind: token, token: navy}}
    body:
      insetsPt: {top: 22, right: 20, bottom: 22, left: 20}
      paragraphs:
        - {runs: [{text: "3. Bandingkan"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 24, weight: 700, color: {kind: token, token: white}}, lineHeight: 1.2, spaceAfterPt: 18}
        - {runs: [{text: "Lot, layer, rata-rata harga, dan indeks eksposur."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: white}}, lineHeight: 1.3, spaceAfterPt: 0}
  - id: indexBoundary
    type: text
    frame: {x: 120, y: 790, width: 1680, height: 130}
    body:
      paragraphs:
        - {runs: [{text: "Indeks heuristik awal, belum dikalibrasi.\nBukan probabilitas rugi atau ukuran risiko seluruh rekening."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, weight: 600, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: contractBoundary
    type: text
    frame: {x: 120, y: 950, width: 1680, height: 65}
    body:
      paragraphs:
        - {runs: [{text: "Kontrak belum tervalidasi: bukan P/L uang atau margin call aktual."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 19, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: footer
    type: text
    frame: {x: 120, y: 1030, width: 1500, height: 40}
    body:
      paragraphs:
        - {runs: [{text: "MRG · NEWSMAKER  /  05 — 08"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 14.4, color: {kind: token, token: foreground}}, lineHeight: 1.2, spaceAfterPt: 0}
