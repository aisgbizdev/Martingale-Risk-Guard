format: replit.sdm
version: 1
size: {width: 1920, height: 1080}
background: {kind: solid, color: {kind: token, token: background}}
theme:
  colors: {background: "#f7f8fb", foreground: "#17345a", accent: "#1061b3", navy: "#083d79", surface: "#eaf2fb", white: "#ffffff"}
  fonts: {display: Newsreader, body: DM Sans}
elements:
  - id: sectionLabel
    type: text
    frame: {x: 120, y: 88, width: 1500, height: 50}
    body:
      paragraphs:
        - {runs: [{text: "07  /  BUKTI & BATAS VERIFIKASI"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 16, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 0}
  - id: title
    type: text
    frame: {x: 120, y: 160, width: 1680, height: 190}
    body:
      paragraphs:
        - {runs: [{text: "Rilis awal didukung uji, dengan batas yang jelas."}], defaultRunStyle: {font: {kind: token, token: display}, sizePt: 40, weight: 600, color: {kind: token, token: foreground}}, lineHeight: 1.05, spaceAfterPt: 0}
  - id: pwaCount
    type: text
    frame: {x: 120, y: 445, width: 370, height: 230}
    body:
      paragraphs:
        - {runs: [{text: "30"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 84, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.05, spaceAfterPt: 0}
  - id: upgradeCount
    type: text
    frame: {x: 580, y: 445, width: 370, height: 230}
    body:
      paragraphs:
        - {runs: [{text: "30"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 84, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.05, spaceAfterPt: 0}
  - id: pwaLabel
    type: text
    frame: {x: 120, y: 695, width: 370, height: 105}
    body:
      paragraphs:
        - {runs: [{text: "Pemeriksaan PWA lokal"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: upgradeLabel
    type: text
    frame: {x: 580, y: 695, width: 370, height: 105}
    body:
      paragraphs:
        - {runs: [{text: "Pemeriksaan upgrade lokal"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: evidenceScope
    type: text
    frame: {x: 120, y: 850, width: 860, height: 130}
    body:
      paragraphs:
        - {runs: [{text: "Riwayat uji sebelum migrasi · desktop Chromium.\nSumber: dokumentasi verifikasi PWA proyek."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 16, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: nativeBoundary
    type: shape
    frame: {x: 1080, y: 405, width: 720, height: 600}
    geometry: {kind: preset, preset: roundRect, cornerRadius: 20}
    fill: {kind: solid, color: {kind: token, token: navy}}
    body:
      insetsPt: {top: 24, right: 24, bottom: 24, left: 24}
      paragraphs:
        - {runs: [{text: "Belum terverifikasi"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 26, weight: 700, color: {kind: token, token: white}}, lineHeight: 1.2, spaceAfterPt: 24}
        - {runs: [{text: "Android/iPhone asli."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 21, color: {kind: token, token: white}}, lineHeight: 1.25, spaceAfterPt: 16}
        - {runs: [{text: "Safari dan standalone nyata."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 21, color: {kind: token, token: white}}, lineHeight: 1.25, spaceAfterPt: 16}
        - {runs: [{text: "Tidak menjamin semua perangkat."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 21, color: {kind: token, token: white}}, lineHeight: 1.25, spaceAfterPt: 16}
  - id: footer
    type: text
    frame: {x: 120, y: 1030, width: 1500, height: 40}
    body:
      paragraphs:
        - {runs: [{text: "MRG · NEWSMAKER  /  07 — 08"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 14.4, color: {kind: token, token: foreground}}, lineHeight: 1.2, spaceAfterPt: 0}
