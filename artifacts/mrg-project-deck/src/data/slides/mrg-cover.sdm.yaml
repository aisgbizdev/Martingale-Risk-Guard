format: replit.sdm
version: 1
size: {width: 1920, height: 1080}
background: {kind: solid, color: {kind: token, token: background}}
theme:
  colors: {background: "#f7f8fb", foreground: "#17345a", accent: "#1061b3", navy: "#083d79", surface: "#eaf2fb", white: "#ffffff"}
  fonts: {display: Newsreader, body: DM Sans}
assets:
  logo: {src: images/newsmaker-logo-white.png}
elements:
  - id: brandField
    type: shape
    frame: {x: 1170, y: 0, width: 750, height: 1080}
    geometry: {kind: preset, preset: rect}
    fill: {kind: solid, color: {kind: token, token: navy}}
  - id: projectLabel
    type: text
    frame: {x: 120, y: 180, width: 920, height: 65}
    body:
      paragraphs:
        - {runs: [{text: "NEWSMAKER  /  RINGKASAN PROYEK"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 16, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 0}
  - id: title
    type: text
    frame: {x: 120, y: 285, width: 1000, height: 340}
    body:
      paragraphs:
        - {runs: [{text: "Martingale\nRisk Guard"}], defaultRunStyle: {font: {kind: token, token: display}, sizePt: 64, weight: 600, color: {kind: token, token: foreground}}, lineHeight: 1.05, spaceAfterPt: 0}
  - id: subtitle
    type: text
    frame: {x: 120, y: 670, width: 890, height: 170}
    body:
      paragraphs:
        - {runs: [{text: "Memahami eksposur posisi dalam konteks pasar yang berubah."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 24, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: boundary
    type: text
    frame: {x: 120, y: 890, width: 900, height: 100}
    body:
      paragraphs:
        - {runs: [{text: "Alat informasi dan edukasi.\nBukan broker. Tidak mengirim order."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 19, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 0}
  - id: originalLogo
    type: image
    frame: {x: 1300, y: 145, width: 450, height: 280}
    assetId: logo
    fit: contain
  - id: purpose
    type: text
    frame: {x: 1290, y: 560, width: 510, height: 400}
    body:
      paragraphs:
        - {runs: [{text: "Konteks pasar."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 28, weight: 600, color: {kind: token, token: white}}, lineHeight: 1.2, spaceAfterPt: 14}
        - {runs: [{text: "Catatan posisi."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 28, weight: 600, color: {kind: token, token: white}}, lineHeight: 1.2, spaceAfterPt: 14}
        - {runs: [{text: "Simulasi eksposur."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 28, weight: 600, color: {kind: token, token: white}}, lineHeight: 1.2, spaceAfterPt: 14}
  - id: footer
    type: text
    frame: {x: 120, y: 1030, width: 900, height: 40}
    body:
      paragraphs:
        - {runs: [{text: "MRG · NEWSMAKER  /  01 — 08"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 14.4, color: {kind: token, token: foreground}}, lineHeight: 1.2, spaceAfterPt: 0}
