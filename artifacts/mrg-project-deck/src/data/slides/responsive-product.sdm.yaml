format: replit.sdm
version: 1
size: {width: 1920, height: 1080}
background: {kind: solid, color: {kind: token, token: background}}
theme:
  colors: {background: "#f7f8fb", foreground: "#17345a", accent: "#1061b3", navy: "#083d79", surface: "#eaf2fb", white: "#ffffff"}
  fonts: {display: Newsreader, body: DM Sans}
assets:
  desktop: {src: images/mrg-desktop.jpg}
  mobile: {src: images/mrg-mobile.jpg}
elements:
  - id: sectionLabel
    type: text
    frame: {x: 120, y: 88, width: 1500, height: 50}
    body:
      paragraphs:
        - {runs: [{text: "06  /  PC · TABLET · MOBILE"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 16, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.2, spaceAfterPt: 0}
  - id: title
    type: text
    frame: {x: 120, y: 160, width: 1680, height: 190}
    body:
      paragraphs:
        - {runs: [{text: "Navigasi menyesuaikan layar pengguna."}], defaultRunStyle: {font: {kind: token, token: display}, sizePt: 40, weight: 600, color: {kind: token, token: foreground}}, lineHeight: 1.05, spaceAfterPt: 0}
  - id: desktopCapture
    type: image
    frame: {x: 120, y: 375, width: 960, height: 600}
    assetId: desktop
    fit: contain
  - id: phoneCapture
    type: image
    frame: {x: 1130, y: 375, width: 270, height: 584}
    assetId: mobile
    fit: contain
  - id: interactionBenefits
    type: text
    frame: {x: 1450, y: 375, width: 350, height: 600}
    body:
      paragraphs:
        - {runs: [{text: "Aksi ringkas."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 22, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.25, spaceAfterPt: 24}
        - {runs: [{text: "Panel adaptif."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 22, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.25, spaceAfterPt: 24}
        - {runs: [{text: "Bantuan singkat."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 22, weight: 700, color: {kind: token, token: accent}}, lineHeight: 1.25, spaceAfterPt: 24}
        - {runs: [{text: "Peringatan risiko tetap terlihat."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 20, color: {kind: token, token: foreground}}, lineHeight: 1.25, spaceAfterPt: 24}
  - id: captureDisclosure
    type: text
    frame: {x: 120, y: 983, width: 1680, height: 45}
    body:
      paragraphs:
        - {runs: [{text: "Screenshot aplikasi · kondisi tanpa catatan · nilai saat pengambilan, bukan harga live di slide."}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 16, color: {kind: token, token: foreground}}, lineHeight: 1.2, spaceAfterPt: 0}
  - id: footer
    type: text
    frame: {x: 120, y: 1034, width: 1500, height: 40}
    body:
      paragraphs:
        - {runs: [{text: "MRG · NEWSMAKER  /  06 — 08"}], defaultRunStyle: {font: {kind: token, token: body}, sizePt: 14.4, color: {kind: token, token: foreground}}, lineHeight: 1.2, spaceAfterPt: 0}
